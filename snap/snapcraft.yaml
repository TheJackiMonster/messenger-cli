name: messenger-cli
version: 0.5.0
title: GNUnet Messenger
summary: An interface using ncurses for the Messenger service of GNUnet.
description: |
  The tool messenger-cli is an terminal interface for the GNUnet Messenger service. The goal is to provide private and secure communication between any group of devices.
  
  Chats will generally created as opt-in. So you can decide who may contact you directly and who does not, accepting to a direct chat. Leaving a chat is also always possible.
website:
  - https://git.gnunet.org/messenger-cli.git/about/
contact:
  - gnunet@thejackimonster.de
donation:
  - https://www.gnunet.org/en/ev.html
  - https://liberapay.com/GNUnet-Messenger/
source-code:
  - https://git.gnunet.org/messenger-cli.git/
issues:
  - https://bugs.gnunet.org
license: GPL-3.0-or-later
adopt-info: messenger-cli
base: core24
confinement: strict
grade: stable

platforms:
  amd64:
    build-on: [amd64]
    build-for: [amd64]
  arm64:
    build-on: [arm64]
    build-for: [arm64]

apps:
  messenger-cli:
    command: usr/bin/messenger-cli
    plugs:
      - home
      - network
      - network-bind

parts:
  gnunet:
    build-packages:
      - libgcrypt20-dev
      - recutils
      - libjansson-dev
      - libsodium-dev
      - libcurl4-gnutls-dev
      - libidn2-dev
      - libunistring-dev
      - libsqlite3-dev
      - libmicrohttpd-dev
      - libltdl-dev
      - zlib1g-dev
      - meson
    stage-packages:
      - libgcrypt20
      - recutils
      - libjansson4
      - libsodium23
      - libcurl3t64-gnutls
      - libidn2-0
      - libunistring5
      - libsqlite3-0
      - libmicrohttpd12
      - libgnutls-dane0
      - libunbound8
      - libltdl7
      - zlib1g
    source: https://ftpmirror.gnu.org/gnunet/gnunet-0.28.0.tar.gz
    source-checksum: sha512/5f05a9d50eda598543e6fd5b7f29ac8ba9c6dfcf8ce537210046febb9475bae9b489c2106009c349b032127f02a7b243d6f444db838af43c70fac9e75ea0cfc9
    plugin: meson
    meson-parameters:
      - --prefix=/usr
      - --buildtype=release
  libgnunetchat:
    after: [ gnunet ]
    build-packages:
      - pkg-config
    source: https://ftpmirror.gnu.org/gnunet/libgnunetchat-0.8.0.tar.gz
    source-checksum: sha512/c6b0a013d29ab3effe5b92cd38ee67a8b5a2cc50f5d2569db4befe82207ae2abd9792fc5db3a665a0c94b786d86a3786199c0a73a6705710628fbc237ebc6899
    plugin: meson
    meson-parameters:
      - --prefix=/usr
      - --buildtype=release
  messenger-cli:
    after: [ gnunet, libgnunetchat ]
    build-packages:
      - libncurses-dev
      - libsecret-1-dev
    stage-packages:
      - libncurses6
      - libsecret-1-0
    source: https://ftpmirror.gnu.org/gnunet/messenger-cli-0.5.0.tar.gz
    source-checksum: sha512/33f2255c3bbeab104b8a680687a647238f2f42e99a73b922f6936127dda74ffec3699dae687dabe3c6aa22527d71a5cc83dbbd1217e43c242335a240cddb0cb2
    plugin: meson
    meson-parameters:
      - --prefix=/usr
      - --buildtype=release
